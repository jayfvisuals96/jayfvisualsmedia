<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAYFVISUALS</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --side-padding: 40px;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #d8d6d3;
            color: #0a0a0a;
        }

        /* NAVBAR */
        nav {
            width: 100%;
            padding: 20px var(--side-padding);
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #d8d6d3;
            position: sticky;
            top: 0;
            z-index: 20;
            flex-wrap: wrap;
        }

        /* ⬅️ Adjust alignment */
        .nav-brand {
            margin-left: 0px;
        }

    /* Top JAYFVISUALS box – corporate style */
.nav-brand a {
    font-size: 1.3rem;
    font-weight: 500;        /* slightly thinner */
    text-decoration: none;
    color: #d8d6d3;          /* greyish-white text */
    background-color: #000;   /* black box */
    padding: 5px 12px;        /* space around text */
    display: inline-block;
    border-radius: 0;          /* square edges */
}

        /* Only the VISUALS part in light blue */
        .logo-blue {
            color: #00eaff; /* light vibrant blue */
        }

        nav a:not(.nav-brand a) {
            text-decoration: none;
            color: #0a0a0a;
            font-weight: 600;
            margin-left: 20px;
        }

        /* THIN LINE UNDER NAVBAR */
        .nav-line {
            height: 1px;
            background-color: #000;
            margin: 8px auto 0 auto;  /* keeps it centered under navbar */
            width: calc(100% - 0px); /* adjust this number to change length */
        }

        /* HERO VIDEO */
        .hero {
            width: 100%;
            position: relative;
            overflow: hidden;
            background: #d8d6d3; /* grey background so no black bars */
            padding-top: 20px;
            padding-bottom: -50px;
        }

        /* Responsive 16:9 YouTube container with proper scaling */
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 ratio */
            margin: 0 auto;
            overflow: visible;
            text-align: center;
        }

        .youtube-video {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(45px) scale(0.7);
            transform-origin: top center;
            width: 100%;
            height: 100%;
        }

        /* HERO TEXT OVERLAY HORIZONTAL */
        .hero-overlay {
            position: absolute;
            top: 10px;
            left: var(--side-padding);
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px; /* spacing between text and line */
            color: #000; /* black text */
        }

    .hero-overlay h1 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 500; /* slightly thinner than before */
    font-family: 'Helvetica', 'Arial', sans-serif; /* optional: professional font */
}

        .hero-overlay .separator {
            display: inline-block;
            width: 2px; /* thickness of vertical line */
            height: 18px; /* height of line */
            background-color: #000; /* black line */
        }

        .hero-overlay p {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 400;
        }

/* CONTACT SECTION */
.contact {
    margin: 10px auto;
    text-align: center;
    padding: 0px;
}

.contact h2 {
    font-size: 1.8rem; /* slightly smaller */
    margin-bottom: 12px;
    font-weight: 500;   /* match the lighter weight of hero text */
    font-family: 'Helvetica', 'Arial', sans-serif; /* optional for professional look */
}

        .contact a {
            color: #000;
            text-decoration: none;
            font-weight: 400;
            font-size: 1.1rem;
        }

        /* SOCIAL ICONS */
        .social-icons {
            margin-top: 10px;
        }

        .social-icons a {
            text-decoration: none;
            color: #000;
            font-size: 1.4rem;
            margin: 0 8px;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            :root {
                --side-padding: 20px;
            }

            .nav-brand {
                margin-left: -20px;
            }

            .hero-overlay h1 {
                font-size: 1.2rem;
            }

            .hero-overlay p {
                font-size: 0.9rem;
            }

            .youtube-video {
                transform: translateX(-50%) scale(0.45); /* scale down more on mobile */
            }
        }
    </style>
</head>

<body>

        .social-icons a {

        .social-icons a:hover {

        }

        .social-icons a:hover ~ a,
        .social-icons a:not(:hover) {
            opacity: 0.5; /* fade other icon */
