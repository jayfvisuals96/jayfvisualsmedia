

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAYFVISUALS – Corporate Videography</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --side-padding: 40px;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #d8d6d3;
            color: #0a0a0a;
        }

        /* NAVBAR */
        nav {
            width: 100%;
            padding: 20px var(--side-padding);
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #d8d6d3;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        /* ⬅️ NAV BRAND ADJUSTMENT */
        .nav-brand {
            margin-left: -20px;
        }

        nav a {
            text-decoration: none;
            color: #0a0a0a;
            font-weight: 600;
            margin-left: 20px;
        }

        /* HERO VIDEO */
        .hero {
            width: 100%;
            height: 75vh;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .hero video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* HERO TEXT OVERLAY */
        .hero-overlay {
            position: absolute;
            top: 40px;
            left: var(--side-padding);
            z-index: 5;
            color: white;
        }

        .hero-overlay h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .hero-overlay p {
            margin-top: 6px;
            font-size: 0.95rem;
            font-weight: 300;
            opacity: 0.9;
        }

        /* CONTACT SECTION */
        .contact {
            margin: 60px auto;
            text-align: center;
            padding: 20px;
        }

        .contact h2 {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .contact a {
            color: #000;
            text-decoration: none;
            font-weight: 400;
            font-size: 1.1rem;
        }

        /* SOCIAL ICONS */
        .social-icons {
            margin-top: 14px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        .social-icons a:hover {
            opacity: 1;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            :root {
                --side-padding: 20px;
            }

            .nav-brand {
                margin-left: -20px;
            }

            .hero {
                height: 60vh;
            }

            .hero-overlay h1 {
                font-size: 1.2rem;
            }

            .hero-overlay p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav>
        <div class="nav-brand">
            <a href="index.html" style="font-size: 1.3rem; font-weight: 600; text-decoration:none; color:#0a0a0a;">
                JAYFVISUALS
            </a>
        </div>
        <div>
            <a href="index.html">Home</a>
            <a href="projects.html" onclick="alert('Projects page coming soon!'); return false;">Projects</a>
        </div>
    </nav>

    <!-- HERO VIDEO -->
    <section class="hero">
        <video controls>
            <source src="your-hero-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="hero-overlay">
            <h1>JAYFVISUALS</h1>
            <p>Documentary & Corporate Cinematographer</p>
        </div>
    </section>

    <!-- CONTACT SECTION -->
    <section class="contact">
        <h2>Get In Touch</h2>
        <p>
            <a href="mailto:jayfvisuals@outlook.com">jayfvisuals@outlook.com</a>
        </p>

        <!-- SOCIAL ICONS -->
        <div class="social-icons">
            <a href="https://www.instagram.com/jayfvisuals?igsh=YWV4ZmMzN2hkbWZl&utm_source=qr" target="_blank" aria-label="Instagram">
                <!-- Instagram SVG -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="2" width="20" height="20" rx="5" stroke="black" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="4" stroke="black" stroke-width="1.5"/>
                    <circle cx="17" cy="7" r="1" fill="black"/>
                </svg>
            </a>

            <a href="https://www.youtube.com/@jayfvisuals" target="_blank" aria-label="YouTube">
                <!-- YouTube SVG -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="6" width="20" height="12" rx="4" stroke="black" stroke-width="1.5"/>
                    <polygon points="10,9 16,12 10,15" fill="black"/>
                </svg>
            </a>
        </div>
    </section>

    <footer>
        © 2025 JAYFVISUALS — All Rights Reserved
    </footer>

</body>
</html>
