<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAYFVISUALS – Corporate Videography</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --side-padding: 40px;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #d8d6d3;
            color: #0a0a0a;
        }

        /* NAVBAR */
        nav {
            width: 100%;
            padding: 20px var(--side-padding);
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #d8d6d3;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        /* ⬅️ Adjust alignment */
        .nav-brand {
            margin-left: -20px;
        }

        nav a {
            text-decoration: none;
            color: #0a0a0a;
            font-weight: 600;
            margin-left: 20px;
        }

        /* NAV CONTENT WRAPPER FOR LINE */
        .nav-content {
            display: inline-block; /* only as wide as text inside */
            position: relative;
        }

        /* THIN LINE UNDER NAVBAR TEXT */
        .nav-separator {
            height: 1px;
            background-color: #000;
            margin-top: 8px; /* space from navbar text */
        }

        /* HERO VIDEO */
        .hero {
            width: 100%;
            position: relative;
            overflow: hidden;
            background: #d8d6d3; /* grey background so no black bars */
            padding-top: 20px;
            padding-bottom: 20px;
        }

        /* Responsive 16:9 YouTube container with proper scaling */
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 ratio */
            margin: 0 auto;
            overflow: visible;
            text-align: center;
        }

        .youtube-video {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(10px) scale(0.7);
            transform-origin: top center;
            width: 100%;
            height: 100%;
        }

        /* HERO TEXT OVERLAY */
        .hero-overlay {
            position: absolute;
            top: 10px;
            left: var(--side-padding);
            z-index: 5;
            color: white;
        }

        .hero-overlay h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .hero-overlay p {
            margin-top: 6px;
            font-size: 0.95rem;
            font-weight: 300;
            opacity: 0.9;
        }

        /* CONTACT SECTION */
        .contact {
            margin: 40px auto;
            text-align: center;
            padding: 20px;
        }

        .contact h2 {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .contact a {
            color: #000;
            text-decoration: none;
            font-weight: 400;
            font-size: 1.1rem;
        }

        /* SOCIAL ICONS */
        .social-icons {
            margin-top: 10px;
        }

        .social-icons a {
            text-decoration: none;
            color: #000;
            font-size: 1.4rem;
            margin: 0 8px;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            :root {
                --side-padding: 20px;
            }

            .nav-brand {
                margin-left: -20px;
            }

            .hero-overlay h1 {
                font-size: 1.2rem;
            }

            .hero-overlay p {
                font-size: 0.9rem;
            }

            .youtube-video {
                transform: translateX(-50%) scale(0.45); /* scale down more on mobile */
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav>
        <div class="nav-content">
            <div class="nav-brand">
                <a href="index.html" style="font-size: 1.3rem; font-weight: 600; text-decoration:none; color:#0a0a0a;">
                    JAYFVISUALS
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="projects.html" onclick="alert('Projects page coming soon!'); return false;">Projects</a>
            </div>
            <!-- THIN LINE UNDER NAVBAR TEXT -->
            <div class="nav-separator"></div>
        </div>
    </nav>

    <!-- HERO VIDEO -->
    <section class="hero">
        <div class="video-container">
            <iframe class="youtube-video" src="https://www.youtube.com/embed/XyHjzJdLcwM" 
                    frameborder="0" allow="autoplay; fullscreen" allowfullscreen>
            </iframe>
        </div>

        <div class="hero-overlay">
            <h1>JAYFVISUALS</h1>
            <p>Documentary & Corporate Cinematographer</p>
        </div>
    </section>

    <!-- CONTACT SECTION -->
    <section class="contact">
        <h2>Get In Touch</h2>
        <p>
            <a href="mailto:jayfvisuals@outlook.com">jayfvisuals@outlook.com</a>
        </p>
        <div class="social-icons">
            <a href="https://www.instagram.com/jayfvisuals?igsh=YWV4ZmMzN2hkbWZl&utm_source=qr" target="_blank">&#x1F47E;</a>
            <a href="https://www.youtube.com/@jayfvisuals" target="_blank">&#x25B6;</a>
        </div>
    </section>

    <footer>
        © 2025 JAYFVISUALS — All Rights Reserved
    </footer>

</body>
</html>
